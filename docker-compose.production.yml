# The production-like environment scripts/ci.sh deploys the one production image to.
name: app-production

services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://app_user:app_password@production-database:5432/app
    ports:
      - '127.0.0.1:${APP_HOST_PORT:-8080}:3000'
    depends_on:
      production-database:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15

  production-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - production-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_user -d app']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  production-data:
